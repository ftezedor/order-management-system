spring:
  application:
    name: order-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:32768/orders}
    username: ${POSTGRES_USERNAME:u_order}
    password: ${POSTGRES_PASSWORD:L@bastrav1a}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Use 'validate' for production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:order}
    password: "${RABBITMQ_PASS:L@bracant0}"
    exchange: amq.topic
    queue: order-created-queue

management:
  health:
    rabbit:
      enabled: false # disable Spring's built-in RabbitHealthIndicator
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    export:
      enabled: false # FIXED: Corrected typo
    sampling:
      probability: 1.0  # Use 1.0 as a number, not "1.0"
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
      connect-timeout: 200

# Add traceId (provided by Micrometer) and your custom orderId to the default level pattern
logging:
  level:
    com.acme.order.bootstrap.spring.aop: TRACE
    com.acme.order.bootstrap.spring.aop.LoggingAspect: TRACE
    org.hibernate: error
    zipkin2:
      reporter:
        internal:
          AsyncReporter: "OFF"
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    level: "%5p [${spring.application.name:-},%X{traceId:-},%X{orderId:-}]"
  exception-conversion-word: "%wEx"